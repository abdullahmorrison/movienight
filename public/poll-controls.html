<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night · Poll Controls</title>
<link rel="stylesheet" href="/app.css">
<script>
  // Accent is a one-variable swap: ?accent=red for the red build, ?accent=purple for Twitch.
  try {
    const q = new URLSearchParams(location.search).get('accent');
    const a = q || localStorage.getItem('mn_accent');
    if (a) { document.documentElement.dataset.accent = a; }
    if (q) { localStorage.setItem('mn_accent', q); }
  } catch (e) { /* private browsing: fall back to the default accent */ }
</script>

<style>
  /* Built for a phone in one hand while the stream runs, so the column stays
     narrow. Overriding --content keeps the header and the body on the same
     centre line, since both derive their width from it. */
  .wrap { max-width: 1120px; margin-inline: auto; }

  /* Controls on the left, the things you set up once beside them. Stacks below
     the point where two columns would each be too narrow to use. */
  .controls-layout {
    display: grid; gap: 18px; align-items: start;
    grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
  }
  @media (max-width: 940px) {
    .controls-layout { grid-template-columns: minmax(0, 1fr); }
    .wrap { max-width: 680px; }
  }
  .controls-layout .card:last-child { margin-bottom: 0; }
  .line { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .line img { width: 42px; height: 63px; object-fit: cover; border-radius: 3px; flex: none; background: var(--surface-2); }
  .line .t { flex: 1; min-width: 0; }
  .line .t b { display: block; font-size: 14.5px; }
  .line .t small { color: var(--muted); font-size: 12px; }
  .line .t a { color: var(--muted); font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--line); }
  .line .t a:hover { color: #fff; }
  .ph { width: 42px; height: 63px; border-radius: 3px; flex: none;
        background: linear-gradient(160deg,#262626,#161616); }
  .win { display: flex; gap: 16px; align-items: center; }
  .win img { width: 84px; border-radius: 4px; flex: none; }
  .win h2 { margin: 4px 0; font-size: 24px; font-weight: 900; letter-spacing: -.025em; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1><a href="/" class="home"><span class="mark">🍿</span>Poll Controls</a> <small id="chan"></small></h1>
    <div id="auth"></div>
  </div>
</header>
<div class="wrap">
  <main id="main" class="pad"></main>
  <footer class="site-footer pad">
    <p class="oss">
      Free and open source &mdash;
      <a href="https://github.com/abdullahmorrison/movienight" target="_blank" rel="noopener">view the code on GitHub</a>.
      No ads, no tracking, and no Twitch tokens kept &mdash; just your profile and your picks.
    </p>
    <p class="madeby">
      Made by
      <a href="https://twitch.tv/abdullahmorrison" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>abdullahmorrison</a>
    </p>
  </footer>
</div>

<div class="modal" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="sheet">
    <div class="glyph" id="confirm-glyph">🚫</div>
    <h3 id="confirm-title"></h3>
    <p id="confirm-body"></p>
    <div class="choices">
      <button class="btn grey" id="confirm-no">Cancel</button>
      <button class="btn danger-solid" id="confirm-yes">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import { profileHtml, wireProfile } from '/profile.js';

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
let state = null;
let duration = null;   // seconds, kept across re-renders

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

/** Styled stand-in for window.confirm. Resolves true when the action is approved. */
function confirmAction({ glyph = '🚫', title, body, verb, danger = true }) {
  return new Promise((resolve) => {
    const box = $('#confirm');
    $('#confirm-glyph').textContent = glyph;
    $('#confirm-title').textContent = title;
    $('#confirm-body').textContent = body;

    const yes = $('#confirm-yes');
    yes.textContent = verb;
    yes.className = `btn ${danger ? 'danger-solid' : 'cta'}`;

    const done = (answer) => {
      box.hidden = true;
      document.removeEventListener('keydown', onKey);
      resolve(answer);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') done(false);
      if (e.key === 'Enter') done(true);
    };

    yes.onclick = () => done(true);
    $('#confirm-no').onclick = () => done(false);
    box.onclick = (e) => { if (e.target.id === 'confirm') done(false); };
    document.addEventListener('keydown', onKey);

    box.hidden = false;
    yes.focus();
  });
}

async function post(url, body) {
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? 'Failed.');
  return data;
}

function toast(m, err) {
  const t = $('#toast');
  if (t) { t.textContent = m; t.className = err ? 'toast err' : 'toast'; }
}

const MIN = 30, MAX = 600, STEP = 30;

function durationPicker(label) {
  const secs = duration ?? state.rules.pollDurationSeconds;
  return `
    <div class="picker">
      <div class="head">
        <span class="label">${label}</span>
        <span class="value" id="dur-value">${clock(secs * 1000)}</span>
      </div>
      <input type="range" id="dur" min="${MIN}" max="${MAX}" step="${STEP}" value="${secs}"
             aria-label="${label}">
      <div class="ticks"><span>30s</span><span>5 min</span><span>10 min</span></div>
    </div>`;
}

/** Copies the field's value, falling back to selecting it if the API is blocked. */
function wireCopy(buttonId, inputId) {
  const btn = $(`#${buttonId}`);
  const input = $(`#${inputId}`);
  if (!btn || !input) return;

  btn.onclick = async () => {
    const label = btn.textContent;
    try {
      await navigator.clipboard.writeText(input.value);
      btn.textContent = 'Copied';
    } catch {
      // Clipboard access can be refused; leave it selected so Ctrl+C works.
      input.select();
      btn.textContent = 'Press Ctrl+C';
    }
    setTimeout(() => { btn.textContent = label; }, 1800);
  };
  input.onclick = () => input.select();
}

function wirePicker() {
  const slider = $('#dur');
  if (!slider) return;
  duration = Number(slider.value);
  slider.oninput = () => {
    duration = Number(slider.value);
    $('#dur-value').textContent = clock(duration * 1000);
  };
}

const thumb = (m) => m.poster
  ? `<img src="${esc(state.posterBase)}/w92${esc(m.poster)}" alt="" loading="lazy">`
  : `<div class="ph"></div>`;

function render() {
  $('#chan').textContent = state.channel ? `#${state.channel}` : '';
  $('#auth').innerHTML = state.me
    ? `<a class="btn" href="/">Vote page</a>
       ${profileHtml(state.me)}`
    : `<a class="btn cta" href="/auth/login"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg> Sign in with Twitch</a>`;

  if (state.me) wireProfile(async () => { await post('/auth/logout'); location.reload(); });

  if (!state.me) { $('#main').innerHTML = '<div class="card empty">Sign in with the streamer account.</div>'; return; }
  if (!state.me.isBroadcaster) { $('#main').innerHTML = '<div class="card empty">Streamer only.</div>'; return; }

  const voting = state.phase === 'voting';
  const shortlist = state.nominations.slice(0, state.rules.shortlistSize);

  // While a poll runs the ballot is fixed, so nothing here is actionable. Show
  // the live tally instead of a board with controls that cannot be used.
  const ballot = state.options
    .map((o) => `
      <div class="line">
        ${thumb(o)}
        <div class="t">
          <b>${o.position}. ${esc(o.title)}</b>
          <small>${o.year ? o.year + ' · ' : ''}${o.votes} ${o.votes === 1 ? 'vote' : 'votes'}</small>
        </div>
      </div>`)
    .join('');

  const board = state.nominations.length
    ? state.nominations.map((n, i) => `
        <div class="line">
          ${thumb(n)}
          <div class="t">
            <b>${i < state.rules.shortlistSize ? '★ ' : ''}${esc(n.title)}</b>
            <small>${n.year ? n.year + ' · ' : ''}${n.interest} ${n.interest === 1 ? 'person wants' : 'people want'} this · by ${esc(n.nominator)}</small>
            ${n.trailer ? `<a href="https://www.youtube.com/watch?v=${esc(n.trailer)}"
               target="_blank" rel="noopener noreferrer">▶ Trailer</a>` : ''}
          </div>
          <button class="btn danger" data-veto="${n.id}" data-title="${esc(n.title)}">Veto</button>
        </div>`).join('')
    : '<div class="empty">No nominations yet.</div>';

  $('#main').innerHTML = `
    <div class="controls-layout">
      <div class="col-main">
    <div class="card">
      ${voting ? `
        <div class="eyebrow"><span class="dot live"></span> Voting open ·
          <span class="timer" id="t">${clock(state.poll.closesAt - Date.now())}</span></div>
        <p class="lede">${state.voters} ${state.voters === 1 ? 'person has' : 'people have'} voted so far.
          Nominations are closed until this poll ends.</p>
        <button class="btn cta big" id="close">Close voting early</button>
        <button class="btn ghost big" id="cancel" style="margin-top:9px">Cancel poll — no winner</button>
      ` : state.tie.length > 1 ? `
        <div class="eyebrow"><span class="dot live"></span> Tied — nothing decided yet</div>
        <p class="lede"><b>${state.tie.map((t) => esc(t.title)).join(' vs ')}</b> —
          ${state.tie[0].votes} ${state.tie[0].votes === 1 ? 'vote' : 'votes'} each.
          Run it again between just these, or call it yourself.</p>
        ${durationPicker('Tiebreaker length')}
        <button class="btn cta big" id="tiebreak">Start the tiebreaker</button>
        <p class="lede" style="margin:16px 0 8px">Or just pick one:</p>
        ${state.tie.map((t) => `
          <button class="btn ghost big" data-settle="${t.nominationId}" data-title="${esc(t.title)}"
            style="margin-bottom:8px">Declare ${esc(t.title)} the winner</button>`).join('')}
      ` : `
        <div class="eyebrow"><span class="dot"></span>
          ${state.phase === 'results' ? 'Last poll finished' : 'Nominations open'}</div>
        ${state.phase === 'results' ? `
          <p class="lede">Put this week away before starting the next vote — the winner is
            still on the front page, and it clears itself after
            ${state.rules.resultsVisibleHours}h anyway.</p>
          <button class="btn cta big" id="dismiss">Clear the result</button>
        ` : `
          ${shortlist.length < 2
            ? `<p class="lede">A vote needs at least two movies to choose between, and
                 ${shortlist.length === 1
                   ? `only <b>${esc(shortlist[0].title)}</b> is on the board.`
                   : 'the board is empty.'}
                 ${state.channel ? `Send people to ${esc(location.host)} to nominate.` : ''}</p>`
            : `<p class="lede">Opens a vote on the top ${state.rules.shortlistSize} by interest:
                 <b>${shortlist.map((n) => esc(n.title)).join(', ')}</b></p>`}
          ${durationPicker('Voting time')}
          <button class="btn cta big" id="start" ${shortlist.length < 2 ? 'disabled' : ''}>
            ${shortlist.length < 2 ? 'Waiting for more nominations' : 'Start voting'}</button>
        `}
      `}
      <div class="toast" id="toast"></div>
    </div>

    ${state.phase === 'results' && state.winner ? `
      <div class="card win">
        ${state.winner.poster ? `<img src="${esc(state.posterBase)}/w185${esc(state.winner.poster)}" alt="">` : ''}
        <div>
          <div class="eyebrow" style="margin-bottom:2px">Winner</div>
          <h2>${esc(state.winner.title)}</h2>
          <p class="muted">Won with ${state.winner.votes} of ${state.voters} ${state.voters === 1 ? 'vote' : 'votes'}</p>
        </div>
      </div>` : ''}

    ${voting
      ? `<div class="card"><div class="eyebrow">On the ballot — live</div>${ballot}</div>`
      : state.phase === 'results' || state.tie.length > 1
        // A result is already decided; the board is next week's business and
        // vetoing now would change nothing about it.
        ? ''
        : `<div class="card">
             <div class="eyebrow">The board — veto anything you can't or won't stream</div>
             ${board}
           </div>`}
      </div>

      <div class="col-side">
    <div class="card">
      <div class="eyebrow">While the vote runs</div>
      <label class="toggle">
        <!-- The setting is stored as showTally; the box asks the opposite. -->
        <input type="checkbox" id="hide-votes" ${state.showTally ? '' : 'checked'}>
        <span>
          <b>Hide vote counts from viewers</b>
          <small>Keeps the running count to yourself until voting closes, so nobody
            piles onto whatever is already ahead. The final result is always shown,
            and so is how many people have voted.</small>
        </span>
      </label>
    </div>

    <div class="card">
      <div class="eyebrow">OBS overlay</div>
      <div class="copy-row">
        <input type="text" id="overlay-url" readonly value="${location.origin}/overlay"
               aria-label="OBS browser source URL">
        <button class="btn" id="copy-overlay">Copy</button>
      </div>
      <ol class="steps-list">
        <li>OBS → <b>Sources</b> → <b>+</b> → <b>Browser</b></li>
        <li>Paste the link above into <b>URL</b></li>
        <li>Set <b>Width</b> 1920, <b>Height</b> 1080</li>
        <li>Drag it above your other layers</li>
      </ol>
      <p class="copy-hint"><b>Add it once and leave it on.</b> It is invisible until a vote
        starts, then slides in, holds the winner for ${state.rules.revealSeconds}s, and
        slides away.</p>
    </div>

    <div class="card">
      <div class="eyebrow">Send viewers here to nominate</div>
      <div class="copy-row">
        <input type="text" id="site-url" readonly value="${location.origin}/"
               aria-label="Vote page URL">
        <button class="btn grey" id="copy-site">Copy</button>
      </div>
    </div>
      </div>
    </div>`;

  const hideBox = $('#hide-votes');
  if (hideBox) hideBox.onchange = async () => {
    try {
      await post('/api/settings/tally', { show: !hideBox.checked });
      toast(hideBox.checked ? 'Counts hidden from viewers.' : 'Counts visible to viewers.');
    } catch (e) {
      hideBox.checked = !hideBox.checked;
      toast(e.message, true);
    }
  };

  wireCopy('copy-overlay', 'overlay-url');
  wireCopy('copy-site', 'site-url');

  const dismissBtn = $('#dismiss');
  if (dismissBtn) dismissBtn.onclick = async () => {
    const ok = await confirmAction({
      glyph: '🧹',
      title: 'Clear the result?',
      body: `${state.winner ? esc(state.winner.title) : 'The winner'} comes off the front page and `
        + 'it goes back to taking nominations. It stays recorded as a past winner either way.',
      verb: 'Clear it',
      danger: false,
    });
    if (!ok) return;
    try { await post('/api/poll/dismiss'); toast('Back to nominations.'); }
    catch (e) { toast(e.message, true); }
  };

  wirePicker();

  const tiebreakBtn = $('#tiebreak');
  if (tiebreakBtn) tiebreakBtn.onclick = async () => {
    try { await post('/api/poll/tiebreak', { durationSeconds: duration }); toast('Tiebreaker open.'); }
    catch (e) { toast(e.message, true); }
  };

  $$('[data-settle]').forEach((b) => {
    b.onclick = async () => {
      const ok = await confirmAction({
        glyph: '🏆',
        title: `Make ${b.dataset.title} the winner?`,
        body: 'This ends the tie without another vote. It cannot be undone.',
        verb: 'Declare winner',
        danger: false,
      });
      if (!ok) return;
      try { const r = await post('/api/poll/settle', { nominationId: Number(b.dataset.settle) });
            toast(`Winner: ${r.winner?.title ?? ''}`); }
      catch (e) { toast(e.message, true); }
    };
  });

  const startBtn = $('#start');
  if (startBtn) startBtn.onclick = async () => {
    try { await post('/api/poll/open', { durationSeconds: duration }); toast('Voting is open.'); }
    catch (e) { toast(e.message, true); }
  };

  const c = $('#close');
  if (c) c.onclick = async () => {
    const ok = await confirmAction({
      glyph: '🏁',
      title: 'Close voting early?',
      body: `Voting stops now instead of when the timer runs out, and the winner is decided
        from the ${state.voters} ${state.voters === 1 ? 'vote' : 'votes'} cast so far.`,
      verb: 'Close voting',
      danger: false,
    });
    if (!ok) return;
    try { const r = await post('/api/poll/close'); toast(`Winner: ${r.winner?.title ?? 'none'}`); }
    catch (e) { toast(e.message, true); }
  };

  const cancelBtn = $('#cancel');
  if (cancelBtn) cancelBtn.onclick = async () => {
    const ok = await confirmAction({
      title: 'Cancel this poll?',
      body: 'Voting stops and nothing wins. Every movie stays on the board and you can '
        + 'start again whenever you like.',
      verb: 'Cancel the poll',
    });
    if (!ok) return;
    try { await post('/api/poll/cancel'); toast('Poll cancelled — nothing was decided.'); }
    catch (e) { toast(e.message, true); }
  };

  $$('[data-veto]').forEach((b) => {
    b.onclick = async () => {
      const ok = await confirmAction({
        title: `Veto ${b.dataset.title}?`,
        body: 'It comes off the board and will not appear in the vote. You can re-nominate it later.',
        verb: 'Veto it',
      });
      if (!ok) return;
      try { await post(`/api/veto/${b.dataset.veto}`); }
      catch (e) { toast(e.message, true); }
    };
  });
}

// full=1 asks for the real counts; the server grants it to the broadcaster only.
async function refresh() { state = await (await fetch('/api/state?full=1')).json(); render(); }

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    // Broadcasts carry the viewer-facing snapshot, which may have the counts
    // stripped. The streamer's page asks for its own copy instead.
    if (msg.type === 'state') refresh();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

setInterval(() => {
  const t = $('#t');
  if (t && state?.poll) t.textContent = clock(state.poll.closesAt - Date.now());
}, 250);

await refresh();
connect();
</script>
</body>
</html>
