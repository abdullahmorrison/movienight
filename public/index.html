<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Movie Night <small id="chan"></small></h1>
    <div id="auth"></div>
  </div>
</header>
<div class="wrap">
  <main id="main"></main>
  <p class="muted pad" id="cmds"></p>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

let state = null;
let picks = new Set();
let dirty = false;
let searchOpen = [];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const img = (path, size) => (path ? `${state.posterBase}/${size}${path}` : null);

function posterEl(m, size = 'w342') {
  const src = img(m.poster, size);
  return src
    ? `<img src="${esc(src)}" alt="${esc(m.title)}" loading="lazy">`
    : `<div class="noposter">${esc(m.title)}</div>`;
}

function trailerBtn(m, cls = 'trailer-link') {
  if (!m.trailer) return '';
  return `<a class="${cls}" href="https://www.youtube.com/watch?v=${esc(m.trailer)}"
             target="_blank" rel="noopener noreferrer">▶ Trailer</a>`;
}

async function post(url, body) {
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? 'Something broke.');
  return data;
}

function toast(msg, isErr) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.className = isErr ? 'toast err' : 'toast';
  if (!isErr) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

/* ---------- header ---------- */

function renderAuth() {
  $('#chan').textContent = state.channel ? `#${state.channel}` : '';
  $('#auth').innerHTML = state.me
    ? `<span class="who">${esc(state.me.login)}${state.me.isBroadcaster ? ' · streamer' : ''}</span>
       <button class="btn grey" id="logout">Sign out</button>`
    : `<a class="btn red" href="/auth/login"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg> Sign in with Twitch</a>`;
  const out = $('#logout');
  if (out) out.onclick = async () => { await post('/auth/logout'); location.reload(); };
}

/* ---------- hero ---------- */

function hero(m, kicker, facts, cta) {
  const back = img(m.backdrop, 'w1280') ?? img(m.poster, 'w780');
  return `
  <section class="hero">
    ${back ? `<div class="art"><img src="${esc(back)}" alt=""></div>` : '<div class="art"></div>'}
    <div class="body">
      <div class="k">${kicker}</div>
      <h2>${esc(m.title)}</h2>
      <div class="facts">${facts}</div>
      ${m.overview ? `<p class="syn">${esc(m.overview)}</p>` : ''}
      <div class="cta">${cta}</div>
    </div>
  </section>`;
}

/* ---------- tiles ---------- */

function nomTile(n, i) {
  const shortlisted = i < state.rules.shortlistSize;
  const mine = state.myInterest.includes(n.id);
  return `
    <div class="tile ${mine ? 'mine' : ''}">
      <div class="poster">
        <span class="rank">${i + 1}</span>
        <span class="badge ${shortlisted ? 'top' : ''}">${n.interest}</span>
        ${posterEl(n)}
        <div class="meta">
          <b>${esc(n.title)}</b>
          <small>${n.year ? n.year + ' · ' : ''}${esc(n.nominator)}</small>
        </div>
      </div>
      <div class="tools">
        <button class="btn ${mine ? 'grey' : ''}" data-interest="${n.id}" ${state.me ? '' : 'disabled'}>
          ${mine ? '✓ Interested' : '+ Interest'}
        </button>
        ${trailerBtn(n)}
      </div>
    </div>`;
}

function ballotTile(o) {
  const on = picks.has(o.nominationId);
  const max = Math.max(1, ...state.options.map((x) => x.approvals));
  return `
    <div class="tile pick ${on ? 'picked' : ''}" data-id="${o.nominationId}"
         role="checkbox" tabindex="0" aria-checked="${on}">
      <div class="poster">
        <span class="rank">${o.position}</span>
        <span class="check">✓</span>
        ${on ? '' : `<span class="badge">${o.approvals}</span>`}
        ${posterEl(o)}
        <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
      </div>
      <div class="tally"><i style="width:${(o.approvals / max) * 100}%"></i></div>
      ${o.trailer ? `<div class="tools">${trailerBtn(o)}</div>` : ''}
    </div>`;
}

/* ---------- sections ---------- */

function searchBox() {
  if (!state.me) {
    return `<p class="lede">Sign in with Twitch to nominate, or type
      <code>!nominate The Thing</code> in chat.</p>`;
  }
  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input type="text" id="q" placeholder="Search for a movie…" autocomplete="off" spellcheck="false">
      <span class="spin" id="spin"></span>
      <div class="results" id="results"></div>
    </div>
    <div class="toast" id="toast"></div>`;
}

function nominateSection() {
  const board = state.nominations.length
    ? `<div class="grid">${state.nominations.map(nomTile).join('')}</div>`
    : `<div class="empty">Nothing nominated yet. Be first.</div>`;

  return `
    <div class="pad">
      <div class="row-head">
        <h3>Nominate a movie</h3>
        <span class="note">Max ${state.rules.nominationsPerUser} live nominations each</span>
      </div>
      ${searchBox()}
      <div class="row-head">
        <h3>On the board</h3>
        <span class="note">Top ${state.rules.shortlistSize} by interest make the ballot — this is not the vote</span>
      </div>
    </div>
    ${board}`;
}

function renderNominating() {
  const lead = state.nominations[0];
  const head = lead
    ? hero(lead, 'Leading the board', `<b>${lead.interest}</b> interested · nominated by ${esc(lead.nominator)}`,
        `${trailerBtn(lead, 'btn')}
         ${state.me ? `<button class="btn grey" data-interest="${lead.id}">
           ${state.myInterest.includes(lead.id) ? '✓ Interested' : '+ Interest'}</button>` : ''}`)
    : '';
  return head + nominateSection();
}

function renderVoting() {
  const left = state.poll.closesAt - Date.now();
  const lead = [...state.options].sort((a, b) => b.approvals - a.approvals)[0];
  const head = lead
    ? hero(lead, 'Voting open now',
        `<span class="timer ${left < 30000 ? 'urgent' : ''}" id="t">${clock(left)}</span> left · <b>${state.voters}</b> voted`,
        trailerBtn(lead, 'btn'))
    : '';

  return `${head}
    <div class="pad">
      <div class="row-head">
        <h3>Pick everything you'd watch</h3>
        <span class="note">Not just one — that's how chat ends up with something most people want</span>
      </div>
    </div>
    <div class="grid">${state.options.map(ballotTile).join('')}</div>
    <div class="pad">
      ${state.me ? `
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <button class="btn red" id="submit" ${dirty ? '' : 'disabled'}>
            ${dirty ? `Submit ${picks.size} pick${picks.size === 1 ? '' : 's'}` : 'Ballot submitted'}
          </button>
          <span class="muted">${state.voters} voted</span>
        </div>`
        : `<p class="lede">Sign in to vote, or type <code>!vote 1 3</code> in chat.</p>`}
      <div class="toast" id="toast"></div>
    </div>`;
}

function renderResults() {
  const w = state.winner;
  const max = Math.max(1, ...state.options.map((x) => x.approvals));
  const head = w
    ? hero(w, '🏆 Tonight’s movie',
        `<b>${w.approvals}</b> approvals from <b>${state.voters}</b> voters${w.year ? ` · ${w.year}` : ''}`,
        trailerBtn(w, 'btn'))
    : `<div class="empty">Poll closed with no votes cast.</div>`;

  const finals = `<div class="grid">${state.options.map((o) => `
    <div class="tile">
      <div class="poster">
        <span class="badge ${o.nominationId === w?.nominationId ? 'top' : ''}">${o.approvals}</span>
        ${posterEl(o)}
        <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
      </div>
      <div class="tally"><i style="width:${(o.approvals / max) * 100}%"></i></div>
    </div>`).join('')}</div>`;

  return `${head}
    <div class="pad"><div class="row-head"><h3>Final tally</h3></div></div>
    ${finals}
    ${nominateSection()}`;
}

/* ---------- search ---------- */

let searchTimer;
function wireSearch() {
  const q = $('#q');
  if (!q) return;
  const close = () => { searchOpen = []; const r = $('#results'); if (r) r.innerHTML = ''; };

  q.oninput = () => {
    clearTimeout(searchTimer);
    const term = q.value.trim();
    if (term.length < 2) return close();
    searchTimer = setTimeout(() => runSearch(term), 250);
  };
  q.onkeydown = (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Enter' && searchOpen[0]) { e.preventDefault(); choose(searchOpen[0]); }
  };
  document.onclick = (e) => { if (!e.target.closest('.search')) close(); };
}

async function runSearch(term) {
  const spin = $('#spin');
  if (spin) spin.textContent = '…';
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(term)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? 'Search failed.');
    const box = $('#results');
    if (!box) return;

    if (data.enabled === false) {
      // No TMDB key configured — fall back to nominating the raw text.
      searchOpen = [{ title: term, tmdbId: null }];
      box.innerHTML = `
        <button class="result" data-idx="0">
          <div class="noposter" style="width:40px;height:60px;border-radius:2px">?</div>
          <div><div class="r-t">Nominate “${esc(term)}”</div>
          <div class="r-s">Movie search is off — adds the title as typed, with no poster.</div></div>
        </button>`;
    } else {
      searchOpen = data.results;
      box.innerHTML = searchOpen.length
        ? searchOpen.map((m, i) => `
          <button class="result" data-idx="${i}">
            ${m.posterPath
              ? `<img src="${esc(data.posterBase)}/w92${esc(m.posterPath)}" alt="" loading="lazy">`
              : `<div class="noposter" style="width:40px;height:60px;border-radius:2px">?</div>`}
            <div>
              <div class="r-t">${esc(m.title)} <span class="r-y">${m.year ?? ''}</span></div>
              <div class="r-s">${esc(m.overview)}</div>
            </div>
          </button>`).join('')
        : `<div class="result disabled"><div class="r-s">No matches.</div></div>`;
    }
    $$('.result[data-idx]').forEach((b) => {
      b.onclick = () => choose(searchOpen[Number(b.dataset.idx)]);
    });
  } catch (e) {
    toast(e.message, true);
  } finally {
    const s = $('#spin');
    if (s) s.textContent = '';
  }
}

async function choose(movie) {
  if (!movie) return;
  try {
    const r = await post('/api/nominate', { tmdbId: movie.tmdbId, title: movie.title });
    const q = $('#q');
    if (q) q.value = '';
    searchOpen = [];
    const box = $('#results');
    if (box) box.innerHTML = '';
    toast(r.merged ? r.message : `Nominated “${r.title}”`);
  } catch (e) {
    toast(e.message, true);
  }
}

/* ---------- render ---------- */

function render() {
  renderAuth();
  $('#main').innerHTML =
    state.phase === 'voting' ? renderVoting()
    : state.phase === 'results' ? renderResults()
    : renderNominating();

  $('#cmds').innerHTML = state.phase === 'voting'
    ? 'In chat: <code>!vote 1 3</code>'
    : 'In chat: <code>!nominate &lt;title&gt;</code> · <code>!movies</code> · <code>!interest &lt;id&gt;</code> · <code>!trailer &lt;id&gt;</code>';

  wireSearch();

  $$('[data-interest]').forEach((b) => {
    b.onclick = async (e) => {
      e.stopPropagation();
      try { await post(`/api/interest/${b.dataset.interest}`); }
      catch (err) { toast(err.message, true); }
    };
  });

  const toggle = (el) => {
    const id = Number(el.dataset.id);
    picks.has(id) ? picks.delete(id) : picks.add(id);
    dirty = true;
    render();
  };
  $$('.tile.pick').forEach((el) => {
    el.onclick = (e) => {
      // Let the trailer link through instead of toggling the pick.
      if (e.target.closest('a')) return;
      toggle(el);
    };
    el.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(el); } };
  });

  const submit = $('#submit');
  if (submit) submit.onclick = async () => {
    try {
      await post('/api/vote', { nominationIds: [...picks] });
      dirty = false;
      toast('Ballot locked in — change it any time before the timer ends.');
      render();
    } catch (e) { toast(e.message, true); }
  };
}

function apply(next) {
  const pollChanged = next.poll?.id !== state?.poll?.id;
  const typing = document.activeElement?.id === 'q';
  const term = typing ? $('#q').value : null;

  state = next;
  // Never clobber picks someone is mid-edit on.
  if (pollChanged || !dirty) picks = new Set(next.myBallot ?? []);
  render();

  if (typing) {
    const q = $('#q');
    if (q) { q.value = term; q.focus(); }
  }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    // The socket carries no session, so keep our authenticated fields.
    if (msg.type === 'state') {
      apply({ ...msg.data, channel: state?.channel, me: state?.me ?? null,
              myInterest: state?.myInterest ?? [], myBallot: state?.myBallot ?? [] });
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

setInterval(() => {
  const t = $('#t');
  if (t && state?.poll) {
    const left = state.poll.closesAt - Date.now();
    t.textContent = clock(left);
    t.classList.toggle('urgent', left < 30000);
  }
}, 250);

async function refresh() { apply(await (await fetch('/api/state')).json()); }
setInterval(refresh, 15000);
await refresh();
connect();
</script>
</body>
</html>
