<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night</title>
<link rel="stylesheet" href="/app.css">
<script>
  // Accent is a one-variable swap: ?accent=red for the red build, ?accent=purple for Twitch.
  try {
    const q = new URLSearchParams(location.search).get('accent');
    const a = q || localStorage.getItem('mn_accent');
    if (a) { document.documentElement.dataset.accent = a; }
    if (q) { localStorage.setItem('mn_accent', q); }
  } catch (e) { /* private browsing: fall back to the default accent */ }
</script>

</head>
<body>
<header class="top overlay">
  <div class="top-inner">
    <h1><a href="/" class="home">Movie Night</a> <small id="chan"></small></h1>
    <div id="auth"></div>
  </div>
</header>
<div class="wrap">
  <main id="main"></main>
  <footer class="site-footer pad">
    <p class="muted" id="cmds"></p>
    <p class="oss">
      Free and open source &mdash;
      <a href="https://github.com/abdullahmorrison/movienight" target="_blank" rel="noopener">view the code on GitHub</a>.
      No ads, no tracking, and no Twitch tokens kept &mdash; just your profile and your picks.
    </p>
    <p class="madeby">
      Made by
      <a href="https://twitch.tv/abdullahmorrison" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>abdullahmorrison</a>
    </p>
  </footer>
</div>

<div class="modal" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="sheet wide" id="detail-sheet"></div>
</div>

<div class="modal" id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="sheet">
    <div class="glyph">🍿</div>
    <h3 id="gate-title">Sign in to join in</h3>
    <p id="gate-why"></p>
    <a class="btn cta" id="gate-go" href="/auth/login"></a>
    <button class="dismiss" id="gate-no">Not right now</button>
  </div>
</div>

<script type="module">
import { profileHtml, wireProfile } from '/profile.js';

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

let state = null;
let pick = null;      // one vote per person
let dirty = false;
let searchOpen = [];
let deferredState = null;
let lastSignature = null;
let choosing = false;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const img = (path, size) => (path ? `${state.posterBase}/${size}${path}` : null);

function posterEl(m, size = 'w342') {
  const src = img(m.poster, size);
  return src
    ? `<img src="${esc(src)}" alt="${esc(m.title)}" loading="lazy">`
    : `<div class="noposter">${esc(m.title)}</div>`;
}

function trailerBtn(m, cls = 'trailer-link') {
  if (!m.trailer) return '';
  return `<a class="${cls}" href="https://www.youtube.com/watch?v=${esc(m.trailer)}"
             target="_blank" rel="noopener noreferrer">▶ Trailer</a>`;
}

/* ---------- sign-in gate ---------- */

const SLIDERS_ICON = `<svg class="brand-icon stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>`;

const TWITCH_GLYPH = `<svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>`;

function openGate(why) {
  const gate = $('#gate');
  $('#gate-why').textContent = why;
  $('#gate-go').innerHTML = `${TWITCH_GLYPH} Sign in with Twitch`;
  gate.hidden = false;
  $('#gate-go').focus();
}

function closeGate() { $('#gate').hidden = true; }

/** Returns true when the action may proceed; otherwise explains why not. */
function allowed(why) {
  if (state.me) return true;
  openGate(why);
  return false;
}

$('#gate-no').onclick = closeGate;
$('#gate').onclick = (e) => { if (e.target.id === 'gate') closeGate(); };
$('#detail').onclick = (e) => { if (e.target.id === 'detail') closeDetail(); };
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  // The sign-in prompt can open on top of the details, so close that first.
  if (!$('#gate').hidden) return closeGate();
  closeDetail();
});

async function post(url, body) {
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? 'Something broke.');
  return data;
}

function toast(msg, isErr) {
  // The results dropdown is absolutely positioned over everything below the
  // search box, so an error under it was invisible. Close it first.
  if (isErr) {
    searchOpen = [];
    const box = $('#results');
    if (box) box.innerHTML = '';
  }
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.className = isErr ? 'toast err' : 'toast';
  if (!isErr) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

/* ---------- header ---------- */

function renderAuth() {
  $('#chan').textContent = state.channel ? `#${state.channel}` : '';
  $('#auth').innerHTML = state.me
    ? `${state.me.isBroadcaster ? `<a class="btn" href="/poll-controls">${SLIDERS_ICON} Poll Controls</a>` : ''}
       ${profileHtml(state.me, state.me.isBroadcaster
         ? [{ href: '/poll-controls', label: 'Poll Controls' }]
         : [])}`
    : `<a class="btn cta" href="/auth/login"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg> Sign in with Twitch</a>`;
  wireProfile(async () => { await post('/auth/logout'); location.reload(); });
}

/* ---------- hero ---------- */

function hero(m, kicker, facts, cta) {
  const back = img(m.backdrop, 'w1280') ?? img(m.poster, 'w780');
  return `
  <section class="hero">
    ${back ? `<div class="art"><img src="${esc(back)}" alt=""></div>` : '<div class="art"></div>'}
    <div class="inner">
      <div class="body">
        <div class="k">${kicker}</div>
        <h2>${esc(m.title)}</h2>
        <div class="facts">${facts}</div>
        ${m.overview ? `<p class="syn">${esc(m.overview)}</p>` : ''}
        <div class="cta">${cta}</div>
      </div>
    </div>
  </section>`;
}

/* ---------- wanting a movie ---------- */

const wantInFlight = new Set();

/**
 * Flips the button before the server answers. The count and the label are the
 * whole feedback here, so waiting two round trips to show them reads as broken.
 */
async function toggleWant(id) {
  if (!allowed('This marks what you want put up for vote — the vote itself happens live on stream.')) return;
  if (wantInFlight.has(id)) return;
  wantInFlight.add(id);

  const nom = state.nominations.find((n) => n.id === id);
  const had = state.myInterest.includes(id);
  state.myInterest = had ? state.myInterest.filter((x) => x !== id) : [...state.myInterest, id];
  // Only the count moves, not the position: reordering under the cursor mid-click
  // is worse than waiting for the server's ordering a moment later.
  if (nom) nom.interest = Math.max(0, nom.interest + (had ? -1 : 1));
  render();

  let failure = null;
  try {
    await post(`/api/interest/${id}`);
  } catch (e) {
    failure = e;
  }
  wantInFlight.delete(id);
  // Re-read first: the server owns the ordering, and a toast written before
  // this would be wiped by the render it triggers.
  await refresh();
  if (failure) toast(failure.message, true);
}

/* ---------- movie details ---------- */

let detailId = null;

function findMovie(id) {
  const n = state.nominations.find((x) => x.id === id);
  if (n) return { ...n, nominationId: n.id };
  const o = state.options.find((x) => x.nominationId === id);
  return o ? { ...o, id: o.nominationId } : null;
}

function openDetail(id) {
  const m = findMovie(id);
  if (!m) return closeDetail();
  detailId = id;

  const back = img(m.backdrop, 'w1280') ?? img(m.poster, 'w780');
  const wants = m.interest ?? null;
  const votes = state.tallyHidden ? null : (m.votes ?? null);
  const mine = state.myInterest.includes(id);

  const wantLabel = mine ? '✓ Want it' : '+ Want it';
  const voting = state.phase === 'voting';
  const onBallot = pick === id;

  $('#detail-sheet').innerHTML = `
    <div class="detail-art">
      ${back ? `<img src="${esc(back)}" alt="">` : ''}
      <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
      <div class="heading">
        <h3 id="detail-title">${esc(m.title)}</h3>
        <div class="cta">
          ${m.trailer
            ? `<a class="btn" href="https://www.youtube.com/watch?v=${esc(m.trailer)}"
                 target="_blank" rel="noopener noreferrer">▶ Trailer</a>`
            : ''}
          ${voting
            ? `<button class="btn ${onBallot ? 'cta' : 'grey'}" data-detail-vote="${id}">
                 ${onBallot ? '✓ Your vote' : 'Vote for this'}</button>`
            : `<button class="btn ${mine ? 'cta' : 'grey'}" data-detail-want="${id}">
                 ${mine ? '✓ Want it' : '+ Want it'}</button>`}
        </div>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-meta">
        ${m.year ? `<span class="yr">${m.year}</span>` : ''}
        ${voting && m.position ? `<span class="pip">!vote ${m.position}</span>` : ''}
        ${wants !== null ? `<span><b>${wants}</b> ${wants === 1 ? 'person wants' : 'people want'} this</span>` : ''}
        ${votes !== null ? `<span><b>${votes}</b> ${votes === 1 ? 'vote' : 'votes'} so far</span>` : ''}
        ${m.nominator ? `<span>Nominated by ${esc(m.nominator)}</span>` : ''}
      </div>
      ${m.overview
        ? `<p class="syn">${esc(m.overview)}</p>`
        : '<p class="syn none">No synopsis on file for this one.</p>'}
      ${!voting && state.me && m.nominator === state.me.login
        ? (m.usesNominatorSlot
            ? `<p class="withdraw-row">
                 <button class="linkish" data-withdraw="${id}">Take back this nomination</button>
                 <span class="muted"> — it is using one of your slots</span>
               </p>`
            : `<p class="withdraw-row muted">
                 Other people want this now, so it stays on the board — and it no longer
                 uses one of your nomination slots.
               </p>`)
        : ''}
    </div>`;

  $('#detail').hidden = false;
  $('#detail-close').onclick = closeDetail;

  const want = $('[data-detail-want]');
  if (want) want.onclick = () => toggleWant(id);

  const drop = $('#detail [data-withdraw]');
  if (drop) drop.onclick = () => withdraw(id, true);

  const vote = $('[data-detail-vote]');
  if (vote) vote.onclick = () => {
    if (!allowed('Votes are tied to your Twitch account, so nobody can vote twice.')) return;
    pick = pick === id ? null : id;
    dirty = true;
    render(); // redraws this dialog too
  };
}

function closeDetail() { detailId = null; $('#detail').hidden = true; }

/* ---------- how it works ---------- */



/* ---------- tiles ---------- */

function nomTile(n, i) {
  const shortlisted = i < state.rules.shortlistSize;
  const mine = state.myInterest.includes(n.id);
  return `
    <div class="tile ${mine ? 'mine' : ''}">
      <div class="poster" role="button" tabindex="0" data-detail="${n.id}"
           title="More about ${esc(n.title)}">
        ${shortlisted ? '<span class="flag">Up for vote</span>' : ''}
        ${posterEl(n)}
        <div class="meta">
          <b>${esc(n.title)}</b>
          <small>${n.year ? n.year + ' · ' : ''}nominated by ${esc(n.nominator)}</small>
        </div>
      </div>
      <div class="stat"><b>${n.interest}</b> ${n.interest === 1 ? 'person wants' : 'people want'} this</div>
      <div class="tools">
        <button class="btn ${mine ? 'grey' : ''}" data-interest="${n.id}">
          ${mine ? '✓ Want it' : '+ Want it'}
        </button>
        ${trailerBtn(n)}
      </div>
    </div>`;
}

function ballotTile(o) {
  const on = pick === o.nominationId;
  const max = Math.max(1, ...state.options.map((x) => x.votes));
  if (state.tallyHidden) {
    return `
      <div class="tile pick ${on ? 'picked' : ''}" data-id="${o.nominationId}"
           role="radio" tabindex="0" aria-checked="${on}">
        <div class="poster">
          <span class="cmd-pill">!vote ${o.position}</span>
          <button class="info" data-detail="${o.nominationId}" title="More about ${esc(o.title)}"
                  aria-label="More about ${esc(o.title)}">i</button>
          <span class="check">✓</span>
          ${posterEl(o)}
          <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
        </div>
      </div>`;
  }
  return `
    <div class="tile pick ${on ? 'picked' : ''}" data-id="${o.nominationId}"
         role="checkbox" tabindex="0" aria-checked="${on}">
      <div class="poster">
        <span class="cmd-pill">!vote ${o.position}</span>
        <button class="info" data-detail="${o.nominationId}" title="More about ${esc(o.title)}"
                aria-label="More about ${esc(o.title)}">i</button>
        <span class="check">✓</span>
        ${posterEl(o)}
        <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
      </div>
      <div class="tally"><i style="width:${(o.votes / max) * 100}%"></i></div>
      <div class="stat"><b>${o.votes}</b> ${o.votes === 1 ? 'vote' : 'votes'}</div>
      ${o.trailer ? `<div class="tools">${trailerBtn(o)}</div>` : ''}
    </div>`;
}

/* ---------- sections ---------- */

function slotMeter(used, cap) {
  const pips = Array.from({ length: cap }, (_, i) => `<span class="pip ${i < used ? 'on' : ''}"></span>`).join('');
  return `<span class="slot-meter ${used >= cap ? 'full' : ''}">
    <span class="pips">${pips}</span>${used} of ${cap} used</span>`;
}

async function withdraw(id, fromDialog = false) {
  try {
    await post(`/api/nominate/${id}/withdraw`);
    if (fromDialog) closeDetail();
    await refresh();
    toast('Nomination taken back — that slot is free again.');
  } catch (e) {
    toast(e.message, true);
  }
}

function slotRows(mine) {
  return mine.map((n) => `
    <div class="slot-row">
      ${n.poster ? `<img src="${esc(img(n.poster, 'w92'))}" alt="">` : '<span class="ph"></span>'}
      <span class="t">
        <b>${esc(n.title)}</b>
        <small>${n.year ?? ''}${n.year ? ' · ' : ''}nobody else wants it yet</small>
      </span>
      <button class="btn grey" data-withdraw="${n.id}">Take back</button>
    </div>`).join('');
}

/** Shown in place of the search box, with the way out attached to it. */
function slotsFull(mine) {
  const cap = state.rules.nominationsPerUser;
  return `
    <div class="slots-full">
      <h4>${cap === 2 ? 'Both your' : 'All your'} nomination slots are in use</h4>
      <p>Take one back to nominate something else — or leave them, and they free up
        on their own as soon as someone else wants them.</p>
      ${slotRows(mine)}
    </div>`;
}

/**
 * Taking one back should not require hitting the limit first, so the same rows
 * sit under the search box whenever there is anything to take back.
 */
function slotsSpare(mine) {
  if (mine.length === 0) return '';
  return `
    <div class="slots-spare">
      <h4>Your nominations</h4>
      ${slotRows(mine)}
    </div>`;
}

function searchBox() {
  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input type="text" id="q" placeholder="Search for a movie…" autocomplete="off" spellcheck="false">
      <span class="spin" id="spin"></span>
      <div class="results" id="results"></div>
    </div>
    <div class="toast" id="toast"></div>`;
}

/** Only the ones still using a slot — a backed nomination no longer does. */
function myNominations() {
  return state.me
    ? state.nominations.filter((n) => n.nominator === state.me.login && n.usesNominatorSlot)
    : [];
}

function nominateSection() {
  const mine = myNominations();
  const board = state.nominations.length
    ? `<div class="grid">${state.nominations.map(nomTile).join('')}</div>`
    : `<div class="empty">Nothing nominated yet. Be first.</div>`;

  return `
    <div class="pad">
      <div class="row-head">
        <h3>Nominate a movie</h3>
        ${state.me ? slotMeter(mine.length, state.rules.nominationsPerUser) : ''}
      </div>
      ${state.me && mine.length >= state.rules.nominationsPerUser
        ? slotsFull(mine) + '<div class="toast" id="toast"></div>'
        : searchBox() + (state.me ? slotsSpare(mine) : '')}
      <div class="row-head">
        <h3>Nominated so far</h3>
        <span class="note">Most wanted first — the top ${state.rules.shortlistSize} go up for vote
          when ${esc(state.channel ?? 'the streamer')} opens it on stream</span>
      </div>
    </div>
    ${board}`;
}

function renderNominating() {
  // No hero here: a full-bleed backdrop reads as "this is the movie", and
  // during nominations nothing is decided.
  return nominateSection();
}

function renderVoting() {
  const left = state.poll.closesAt - Date.now();
  // Same reasoning as the board: the current leader has not won anything yet.
  const head = `
    <div class="pad">
      <div class="live-bar">
        <div>
          <div class="k">Voting closes in</div>
          <div class="big-timer ${left < 30000 ? 'urgent' : ''}" id="t">${clock(left)}</div>
        </div>
        <div class="spacer"></div>
        <div class="muted">${state.voters} ${state.voters === 1 ? 'person has' : 'people have'} voted${
          state.tallyHidden ? '<br>Counts stay hidden until voting closes' : ''}</div>
      </div>
    </div>`;

  return `${head}
    <div class="pad">
      <div class="row-head">
        <h3>Pick one movie</h3>
        <span class="note">Click a poster, or type its command in chat. You can change it until time runs out.</span>
      </div>
    </div>
    <div class="grid">${state.options.map(ballotTile).join('')}</div>
    <div class="pad">
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <button class="btn cta" id="submit" ${state.me && !dirty ? 'disabled' : ''}>
          ${!state.me ? 'Sign in to vote' : dirty ? 'Submit my vote' : 'Vote saved'}
        </button>
        <span class="muted">${state.voters} voted${state.me ? '' : ' · or vote from chat with !vote 2'}</span>
      </div>
      <div class="toast" id="toast"></div>
    </div>`;
}

function tieBanner() {
  const names = state.tie.map((t) => t.title);
  const readable = names.length === 2
    ? names.join(' and ')
    : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
  return `
    <div class="pad">
      <div class="tie-banner">
        <div class="k">It's a tie</div>
        <h2>${esc(readable)}</h2>
        <p>${state.tie[0].votes} ${state.tie[0].votes === 1 ? 'vote' : 'votes'} each — nothing has
          been decided. ${esc(state.channel ?? 'The streamer')} will run a tiebreaker between these,
          or call it.</p>
        <div class="tie-choices">
          ${state.tie.map((t) => `
            <span class="tie-choice">
              ${t.poster
                ? `<img src="${esc(img(t.poster, 'w92'))}" alt="">`
                : '<span class="ph"></span>'}
              ${esc(t.title)}${t.year ? ` <span class="muted">${t.year}</span>` : ''}
            </span>`).join('')}
        </div>
      </div>
    </div>`;
}

function renderResults() {
  const w = state.winner;
  const max = Math.max(1, ...state.options.map((x) => x.votes));

  if (state.tie.length > 1) {
    const bars = `<div class="grid">${state.options.map((o) => `
      <div class="tile">
        <div class="poster" role="button" tabindex="0" data-detail="${o.nominationId}">
          ${state.tie.some((t) => t.nominationId === o.nominationId)
            ? '<span class="flag">Tied</span>' : ''}
          ${posterEl(o)}
          <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
        </div>
        <div class="tally"><i style="width:${(o.votes / max) * 100}%"></i></div>
        <div class="stat"><b>${o.votes}</b> ${o.votes === 1 ? 'vote' : 'votes'}</div>
      </div>`).join('')}</div>`;
    return `${tieBanner()}
      <div class="pad"><div class="row-head"><h3>Final tally</h3></div></div>
      ${bars}
      <div class="pad"><p class="lede">Nominations reopen once
        ${esc(state.channel ?? 'the streamer')} settles this.</p></div>`;
  }

  const head = w
    ? hero(w, '🏆 Tonight’s movie',
        `Won with <b>${w.votes}</b> of <b>${state.voters}</b> ${state.voters === 1 ? 'vote' : 'votes'}${w.year ? ` · ${w.year}` : ''}`,
        trailerBtn(w, 'btn'))
    : `<div class="empty">Poll closed with no votes cast.</div>`;

  const finals = `<div class="grid">${state.options.map((o) => `
    <div class="tile">
      <div class="poster" role="button" tabindex="0" data-detail="${o.nominationId}"
           title="More about ${esc(o.title)}">
        ${o.nominationId === w?.nominationId ? '<span class="flag">Winner</span>' : ''}
        ${posterEl(o)}
        <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
      </div>
      <div class="tally"><i style="width:${(o.votes / max) * 100}%"></i></div>
      <div class="stat ${o.nominationId === w?.nominationId ? 'win' : ''}">
        <b>${o.votes}</b> ${o.votes === 1 ? 'vote' : 'votes'}</div>
    </div>`).join('')}</div>`;

  return `${head}
    <div class="pad"><div class="row-head"><h3>Final tally</h3></div></div>
    ${finals}
    <div class="pad"><p class="lede">That's this one settled. Nominations for next time
      reopen once ${esc(state.channel ?? 'the streamer')} clears the result.</p></div>`;
}

/* ---------- search ---------- */

let searchTimer;
function wireSearch() {
  const q = $('#q');
  if (!q) return;
  const close = () => {
    searchOpen = [];
    const r = $('#results');
    if (r) r.innerHTML = '';
    flushDeferred();
  };

  if (!state.me) {
    const stop = (e) => {
      e.preventDefault();
      q.blur();
      openGate('Nominations are tied to your Twitch account, so the board stays honest.');
    };
    q.onmousedown = stop;
    q.onfocus = stop;
    return;
  }

  q.oninput = () => {
    clearTimeout(searchTimer);
    const term = q.value.trim();
    if (term.length < 2) return close();
    searchTimer = setTimeout(() => runSearch(term), 250);
  };
  q.onkeydown = (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Enter' && searchOpen[0]) { e.preventDefault(); choose(searchOpen[0]); }
  };
  q.onblur = () => setTimeout(flushDeferred, 150);
  document.onclick = (e) => { if (!e.target.closest('.search')) close(); };
}

async function runSearch(term) {
  const spin = $('#spin');
  if (spin) spin.textContent = '…';
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(term)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? 'Search failed.');
    const box = $('#results');
    if (!box) return;

    if (data.enabled === false) {
      // No TMDB key configured — fall back to nominating the raw text.
      searchOpen = [{ title: term, tmdbId: null }];
      box.innerHTML = `
        <button class="result" data-idx="0">
          <div class="noposter" style="width:40px;height:60px;border-radius:2px">?</div>
          <div><div class="r-t">Nominate “${esc(term)}”</div>
          <div class="r-s">Movie search is off — adds the title as typed, with no poster.</div></div>
        </button>`;
    } else {
      searchOpen = data.results;
      box.innerHTML = searchOpen.length
        ? searchOpen.map((m, i) => `
          <button class="result" data-idx="${i}">
            ${m.posterPath
              ? `<img src="${esc(data.posterBase)}/w92${esc(m.posterPath)}" alt="" loading="lazy">`
              : `<div class="noposter" style="width:40px;height:60px;border-radius:2px">?</div>`}
            <div>
              <div class="r-t">${esc(m.title)} <span class="r-y">${m.year ?? ''}</span></div>
              <div class="r-s">${esc(m.overview)}</div>
            </div>
          </button>`).join('')
        : `<div class="result disabled"><div class="r-s">No matches.</div></div>`;
    }
    $$('.result[data-idx]').forEach((b) => {
      b.onclick = () => choose(searchOpen[Number(b.dataset.idx)]);
    });
  } catch (e) {
    toast(e.message, true);
  } finally {
    const s = $('#spin');
    if (s) s.textContent = '';
  }
}

async function choose(movie) {
  if (!movie) return;
  try {
    const r = await post('/api/nominate', { tmdbId: movie.tmdbId, title: movie.title });
    const q = $('#q');
    if (q) q.value = '';
    searchOpen = [];
    const box = $('#results');
    if (box) box.innerHTML = '';
    await refresh();
    toast(r.merged ? r.message : `Nominated “${r.title}”`);
  } catch (e) {
    toast(e.message, true);
  }
}

/* ---------- past winners ---------- */

const WHEN = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });

/** Always on the page: what the night actually ended up watching, week to week. */
function pastWinners() {
  if (!state.winners.length) {
    return `
      <div class="pad past-head">
        <div class="row-head"><h3>Past winners</h3></div>
        <p class="lede">Nothing has won yet. The first movie night will show up here.</p>
      </div>`;
  }
  return `
    <div class="pad past-head">
      <div class="row-head">
        <h3>Past winners</h3>
        <span class="note">Locked out of nominations for
          ${state.rules.repeatLockoutWeeks} weeks after winning</span>
      </div>
    </div>
    <div class="winners">
      ${state.winners.map((w) => {
        const art = w.poster
          ? `<img src="${esc(img(w.poster, 'w185'))}" alt="" loading="lazy">`
          : `<div class="noposter">${esc(w.title)}</div>`;
        const inner = `
          <span class="art">${art}<span class="when">${esc(WHEN.format(new Date(w.wonAt)))}</span></span>
          <b>${esc(w.title)}</b>
          <small>${w.year ?? ''}</small>`;
        return w.trailer
          ? `<a class="won" href="https://www.youtube.com/watch?v=${esc(w.trailer)}"
               target="_blank" rel="noopener noreferrer" title="Trailer">${inner}</a>`
          : `<div class="won">${inner}</div>`;
      }).join('')}
    </div>`;
}

/* ---------- render ---------- */

function render() {
  renderAuth();
  const main = $('#main');
  // Rebuilt nodes must not animate into whatever state they are already in.
  main.classList.add('settling');
  requestAnimationFrame(() => requestAnimationFrame(() => main.classList.remove('settling')));
  const body =
    state.phase === 'voting' ? renderVoting()
    : state.phase === 'results' ? renderResults()
    : renderNominating();
  // History belongs on the page whatever phase it is in.
  main.innerHTML = body + pastWinners();

  // Only worth saying while it is actionable; the rest of the time it is noise.
  $('#cmds').innerHTML = state.phase === 'voting'
    ? 'You can also vote from chat: <code>!vote 2</code>'
    : '';

  wireSearch();

  $$('#main [data-withdraw]').forEach((b) => {
    b.onclick = () => withdraw(Number(b.dataset.withdraw));
  });

  $$('[data-interest]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      toggleWant(Number(b.dataset.interest));
    };
  });

  $$('[data-detail]').forEach((el) => {
    const show = (e) => {
      e.stopPropagation();
      e.preventDefault();
      openDetail(Number(el.dataset.detail));
    };
    el.onclick = show;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') show(e); };
  });

  const choose_ = (el) => {
    if (!allowed('Votes are tied to your Twitch account, so nobody can vote twice.')) return;
    const id = Number(el.dataset.id);
    // One vote each: picking a different movie moves it rather than adding.
    pick = pick === id ? null : id;
    dirty = true;
    render();
  };
  $$('.tile.pick').forEach((el) => {
    el.onclick = (e) => {
      // Let the trailer link through instead of changing the vote.
      if (e.target.closest('a')) return;
      choose_(el);
    };
    el.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); choose_(el); } };
  });

  if (detailId !== null) openDetail(detailId);

  // Always describes what is currently drawn, so apply() can trust it.
  lastSignature = screenSignature();

  const submit = $('#submit');
  if (submit) submit.onclick = async () => {
    if (!allowed('Votes are tied to your Twitch account, so nobody can vote twice.')) return;
    submit.disabled = true;
    submit.textContent = 'Saving…';
    try {
      await post('/api/vote', { nominationId: pick });
      dirty = false;
      await refresh();
      toast('Vote saved — you can change it until the timer runs out.');
    } catch (e) {
      toast(e.message, true);
      render();
    }
  };
}

/** True while the results dropdown is up or the box has focus. */
function searchBusy() {
  const box = $('#results');
  const q = $('#q');
  return Boolean((box && box.children.length) || (q && document.activeElement === q));
}

function flushDeferred() {
  if (!deferredState) return;
  const next = deferredState;
  deferredState = null;
  apply(next, true);
}

/** Everything on screen, so an identical snapshot can be skipped entirely. */
function screenSignature() {
  return JSON.stringify([
    state.phase,
    state.poll?.id ?? null,
    state.poll?.closedAt ?? null,
    state.voters,
    state.options.map((o) => [o.nominationId, o.votes]),
    state.nominations.map((n) => [n.id, n.interest]),
    state.tie.map((t) => t.nominationId),
    state.winner?.nominationId ?? null,
    state.me?.id ?? null,
    state.myInterest,
    pick,
    dirty,
    detailId,
  ]);
}

function apply(next, force = false) {
  // A rebuild would destroy the result the user is reaching for, so hold the
  // update until they are done with the search box.
  if (!force && searchBusy()) {
    deferredState = next;
    return;
  }
  deferredState = null;

  const pollChanged = next.poll?.id !== state?.poll?.id;
  const typing = document.activeElement?.id === 'q';
  const term = typing ? $('#q').value : null;

  state = next;
  // Never clobber a vote someone is mid-edit on.
  if (pollChanged || !dirty) pick = next.myVote ?? null;

  // The server re-broadcasts every few seconds while a poll is open. Rebuilding
  // the page for an unchanged snapshot throws away whatever the user is
  // clicking, so redraw only when something would actually look different.
  if (screenSignature() === lastSignature) return;

  render();

  if (typing) {
    const q = $('#q');
    if (q) { q.value = term; q.focus(); }
  }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    // The socket carries no session, so keep our authenticated fields.
    if (msg.type === 'state') {
      apply({ ...msg.data, channel: state?.channel, me: state?.me ?? null,
              myInterest: state?.myInterest ?? [], myVote: state?.myVote ?? null });
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

setInterval(() => {
  const t = $('#t');
  if (t && state?.poll) {
    const left = state.poll.closesAt - Date.now();
    t.textContent = clock(left);
    t.classList.toggle('urgent', left < 30000);
  }
}, 250);

async function refresh(force = false) { apply(await (await fetch('/api/state')).json(), force); }
setInterval(refresh, 15000);
await refresh();
connect();
</script>
</body>
</html>
