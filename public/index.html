<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🍿 Movie Night <small id="chan"></small></h1>
    <div id="auth"></div>
  </header>
  <main id="main"></main>
  <p class="muted" id="cmds"></p>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

let state = null;
let picks = new Set();
let dirty = false;
let searchOpen = [];
let searching = false;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

function poster(path, size = 'w342') {
  return path ? `${state.posterBase}/${size}${path}` : null;
}

function posterEl(m, size) {
  const src = poster(m.poster, size);
  return src
    ? `<img src="${esc(src)}" alt="${esc(m.title)}" loading="lazy">`
    : `<div class="noposter">${esc(m.title)}</div>`;
}

async function post(url, body) {
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? 'Something broke.');
  return data;
}

function toast(msg, isErr) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.className = isErr ? 'toast err' : 'toast';
  if (!isErr) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

/* ---------- auth ---------- */

function renderAuth() {
  $('#chan').textContent = state.channel ? `#${state.channel}` : '';
  $('#auth').innerHTML = state.me
    ? `<span class="who">${esc(state.me.login)}${state.me.isBroadcaster ? ' · streamer' : ''}</span>
       <button class="btn ghost" id="logout">Sign out</button>`
    : `<a class="btn" href="/auth/login">Sign in with Twitch</a>`;
  const out = $('#logout');
  if (out) out.onclick = async () => { await post('/auth/logout'); location.reload(); };
}

/* ---------- nominating ---------- */

function nominateBox() {
  if (!state.me) {
    return `<p class="lede">Sign in with Twitch to nominate, or type
      <code>!nominate The Thing</code> in chat.</p>`;
  }
  return `
    <div class="search">
      <span class="icon">🔍</span>
      <input type="text" id="q" placeholder="Search for a movie…" autocomplete="off" spellcheck="false">
      <span class="spin" id="spin"></span>
      <div class="results" id="results"></div>
    </div>
    <p class="muted">Max ${state.rules.nominationsPerUser} live nominations each.</p>`;
}

function movieCard(n, i) {
  const shortlisted = i < state.rules.shortlistSize;
  const mine = state.myInterest.includes(n.id);
  return `
    <div class="movie ${mine ? 'mine' : ''}">
      <div class="poster">
        <span class="rank">${i + 1}</span>
        <span class="badge ${shortlisted ? 'shortlist' : ''}">${shortlisted ? '⭐ ' : ''}${n.interest}</span>
        ${posterEl(n, 'w342')}
        <div class="meta">
          <b>${esc(n.title)}</b>
          <small>${n.year ? n.year + ' · ' : ''}by ${esc(n.nominator)}</small>
        </div>
      </div>
      <div class="actions">
        <button class="btn ${mine ? 'ghost' : ''}" data-interest="${n.id}" ${state.me ? '' : 'disabled'}>
          ${mine ? '✓ Interested' : '+ Interest'}
        </button>
      </div>
    </div>`;
}

function renderNominating() {
  const board = state.nominations.length
    ? `<div class="grid">${state.nominations.map(movieCard).join('')}</div>`
    : `<div class="empty">Nothing nominated yet. Be first. 🎬</div>`;

  return `
  <div class="card">
    <div class="eyebrow"><span class="dot"></span> Nominations open</div>
    <p class="lede">
      Interest ranks the shortlist — the top ${state.rules.shortlistSize} ⭐ make the ballot.
      <b>This is not the vote.</b> The streamer opens the real poll on stream.
    </p>
    ${nominateBox()}
    <div class="toast" id="toast"></div>
  </div>
  ${board}`;
}

/* ---------- voting ---------- */

function ballotCard(o) {
  const on = picks.has(o.nominationId);
  const max = Math.max(1, ...state.options.map((x) => x.approvals));
  return `
    <div class="movie pick ${on ? 'picked' : ''}" data-id="${o.nominationId}"
         role="checkbox" tabindex="0" aria-checked="${on}">
      <div class="poster">
        <span class="rank">${o.position}</span>
        <span class="check">✓</span>
        ${on ? '' : `<span class="badge">${o.approvals}</span>`}
        ${posterEl(o, 'w342')}
        <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
      </div>
      <div class="tally"><i style="width:${(o.approvals / max) * 100}%"></i></div>
    </div>`;
}

function renderVoting() {
  const left = state.poll.closesAt - Date.now();
  return `
  <div class="card">
    <div class="eyebrow">
      <span class="dot live"></span> Voting open ·
      <span class="timer ${left < 30000 ? 'urgent' : ''}" id="t">${clock(left)}</span>
    </div>
    <p class="lede">Pick <b>every</b> movie you'd be happy to watch — not just one.
      That's how the night ends up with something most of chat actually wants.</p>
    <div class="grid ballot">${state.options.map(ballotCard).join('')}</div>
    ${state.me ? `
      <div style="display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap">
        <button class="btn" id="submit" ${dirty ? '' : 'disabled'}>
          ${dirty ? `Submit ${picks.size} pick${picks.size === 1 ? '' : 's'}` : 'Ballot submitted'}
        </button>
        <span class="muted">${state.voters} voted</span>
      </div>`
      : `<p class="lede" style="margin-top:16px">Sign in to vote, or type
         <code>!vote 1 3</code> in chat.</p>`}
    <div class="toast" id="toast"></div>
  </div>`;
}

/* ---------- results ---------- */

function renderResults() {
  const w = state.winner;
  const max = Math.max(1, ...state.options.map((x) => x.approvals));
  const hero = w ? `
    <div class="hero">
      ${poster(w.poster, 'w342') ? `<img src="${esc(poster(w.poster,'w342'))}" alt="">` : ''}
      <div>
        <div class="k">🏆 Tonight's movie</div>
        <h2>${esc(w.title)}${w.year ? ` <span class="muted">(${w.year})</span>` : ''}</h2>
        <p class="muted">${w.approvals} approvals from ${state.voters} voters</p>
      </div>
    </div>` : `<div class="card empty">Poll closed with no votes cast.</div>`;

  const finals = `<div class="grid">${state.options.map((o) => `
    <div class="movie">
      <div class="poster">
        <span class="badge">${o.approvals}</span>
        ${posterEl(o, 'w342')}
        <div class="meta"><b>${esc(o.title)}</b><small>${o.year ?? ''}</small></div>
      </div>
      <div class="tally"><i style="width:${(o.approvals / max) * 100}%"></i></div>
    </div>`).join('')}</div>`;

  return `${hero}
    <div class="card"><div class="eyebrow">Final tally</div></div>
    ${finals}
    <div style="height:26px"></div>
    ${renderNominating()}`;
}

/* ---------- search ---------- */

let searchTimer;
function wireSearch() {
  const q = $('#q');
  if (!q) return;

  const close = () => { searchOpen = []; $('#results').innerHTML = ''; };

  q.oninput = () => {
    clearTimeout(searchTimer);
    const term = q.value.trim();
    if (term.length < 2) return close();
    searchTimer = setTimeout(() => runSearch(term), 250);
  };
  q.onkeydown = (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Enter' && searchOpen[0]) { e.preventDefault(); choose(searchOpen[0]); }
  };
  document.onclick = (e) => { if (!e.target.closest('.search')) close(); };
}

async function runSearch(term) {
  searching = true;
  $('#spin').textContent = '…';
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(term)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? 'Search failed.');

    if (data.enabled === false) {
      // No TMDB key configured — fall back to nominating the raw text.
      searchOpen = [{ title: term, tmdbId: null, year: null, posterPath: null }];
      $('#results').innerHTML = `
        <button class="result" data-idx="0">
          <div class="noposter" style="width:42px;height:63px;border-radius:5px">?</div>
          <div><div class="r-t">Nominate “${esc(term)}”</div>
          <div class="r-s">Movie search is off — this adds the title as typed.</div></div>
        </button>`;
    } else {
      searchOpen = data.results;
      $('#results').innerHTML = searchOpen.length
        ? searchOpen.map((m, i) => `
          <button class="result" data-idx="${i}">
            ${m.posterPath
              ? `<img src="${esc(data.posterBase)}/w92${esc(m.posterPath)}" alt="" loading="lazy">`
              : `<div class="noposter" style="width:42px;height:63px;border-radius:5px">?</div>`}
            <div>
              <div class="r-t">${esc(m.title)} <span class="r-y">${m.year ?? ''}</span></div>
              <div class="r-s">${esc(m.overview)}</div>
            </div>
          </button>`).join('')
        : `<div class="result disabled"><div class="r-s">No matches.</div></div>`;
    }
    $$('.result[data-idx]').forEach((b) => {
      b.onclick = () => choose(searchOpen[Number(b.dataset.idx)]);
    });
  } catch (e) {
    toast(e.message, true);
  } finally {
    searching = false;
    const s = $('#spin');
    if (s) s.textContent = '';
  }
}

async function choose(movie) {
  if (!movie) return;
  const q = $('#q');
  try {
    const r = await post('/api/nominate', { tmdbId: movie.tmdbId, title: movie.title });
    if (q) q.value = '';
    searchOpen = [];
    const results = $('#results');
    if (results) results.innerHTML = '';
    toast(r.merged ? r.message : `Nominated “${r.title}” 🍿`);
  } catch (e) {
    toast(e.message, true);
  }
}

/* ---------- render ---------- */

function render() {
  renderAuth();
  $('#main').innerHTML =
    state.phase === 'voting' ? renderVoting()
    : state.phase === 'results' ? renderResults()
    : renderNominating();

  $('#cmds').innerHTML = state.phase === 'voting'
    ? 'In chat: <code>!vote 1 3</code>'
    : 'In chat: <code>!nominate &lt;title&gt;</code> · <code>!movies</code> · <code>!interest &lt;id&gt;</code>';

  wireSearch();

  $$('[data-interest]').forEach((b) => {
    b.onclick = async () => {
      try { await post(`/api/interest/${b.dataset.interest}`); }
      catch (e) { toast(e.message, true); }
    };
  });

  const toggle = (el) => {
    const id = Number(el.dataset.id);
    picks.has(id) ? picks.delete(id) : picks.add(id);
    dirty = true;
    render();
  };
  $$('.movie.pick').forEach((el) => {
    el.onclick = () => toggle(el);
    el.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(el); } };
  });

  const submit = $('#submit');
  if (submit) submit.onclick = async () => {
    try {
      await post('/api/vote', { nominationIds: [...picks] });
      dirty = false;
      toast('Ballot locked in — change it any time before the timer ends.');
      render();
    } catch (e) { toast(e.message, true); }
  };
}

function apply(next) {
  const pollChanged = next.poll?.id !== state?.poll?.id;
  const wasSearching = document.activeElement?.id === 'q';
  const term = wasSearching ? $('#q').value : null;

  state = next;
  // Never clobber checkboxes someone is mid-edit on.
  if (pollChanged || !dirty) picks = new Set(next.myBallot ?? []);
  render();

  if (wasSearching) {
    const q = $('#q');
    if (q) { q.value = term; q.focus(); }
  }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    // The socket carries no session, so keep our authenticated fields.
    if (msg.type === 'state') {
      apply({ ...msg.data, channel: state?.channel, me: state?.me ?? null,
              myInterest: state?.myInterest ?? [], myBallot: state?.myBallot ?? [] });
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

setInterval(() => {
  const t = $('#t');
  if (t && state?.poll) {
    const left = state.poll.closesAt - Date.now();
    t.textContent = clock(left);
    t.classList.toggle('urgent', left < 30000);
  }
}, 250);

async function refresh() { apply(await (await fetch('/api/state')).json()); }
setInterval(refresh, 15000);
await refresh();
connect();
</script>
</body>
</html>
