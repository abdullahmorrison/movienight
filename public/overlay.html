<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie Night · Overlay</title>
<style>
  :root {
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    /* Twitch purple by default; ?accent=red swaps in the streaming-service red. */
    --accent: #9146ff;
    /* Urgency is never brand-coloured — it has to read as a warning at a glance. */
    --warn: #ff453a;
  }
  :root[data-accent="red"] { --accent: #e50914; }
  * { box-sizing: border-box; }
  /* Transparent for OBS Browser Source. Add ?solid=1 to preview elsewhere. */
  body { margin: 0; background: transparent; color: #fff; }

  .panel {
    width: 800px; padding: 22px 24px; border-radius: 6px;
    background: rgba(10, 10, 10, .9);
    border: 1px solid rgba(255, 255, 255, .1);
    border-top: 3px solid var(--accent);
    box-shadow: 0 22px 60px rgba(0,0,0,.7);
  }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 16px; }
  .head h1 {
    font-size: 15px; margin: 0; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent);
  }
  .head .cmd {
    display: block; margin-top: 5px; font-size: 19px; letter-spacing: -.01em;
    color: #fff; font-weight: 700; text-transform: none;
  }
  .head .cmd code {
    background: rgba(255,255,255,.12); padding: 2px 9px; border-radius: 3px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em;
  }
  .timer { font-size: 44px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.03em; }
  .timer.urgent { color: var(--warn); }

  .row { display: flex; gap: 12px; }
  .item { flex: 1; min-width: 0; }
  .art {
    position: relative; aspect-ratio: 2/3; border-radius: 4px; overflow: hidden;
    background: #232323; outline: 2px solid transparent; outline-offset: -2px;
    transition: outline-color .4s;
  }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art.lead { outline-color: var(--accent); }
  .noposter {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 10px; font-weight: 700; font-size: 14px; color: #808080;
    background: linear-gradient(160deg, #262626, #161616);
  }
  /* The command to type, shown as the command itself. */
  .num {
    position: absolute; top: 6px; left: 6px;
    background: rgba(0,0,0,.82); border: 1px solid rgba(255,255,255,.3);
    border-radius: 3px; padding: 2px 8px; font-weight: 700; font-size: 13px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .art.lead .num { background: var(--accent); border-color: transparent; }
  /* Counts carry their noun so they never read as bare numbers. */
  .count { margin-top: 5px; font-size: 13px; color: #b3b3b3; }
  .count b { color: #fff; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .art.lead ~ .count b { color: var(--accent); }
  .bar { height: 5px; background: rgba(255,255,255,.14); margin-top: 6px; overflow: hidden; border-radius: 2px; }
  .bar i { display: block; height: 100%; background: #6d6d6e; transition: width .55s cubic-bezier(.4,0,.2,1); }
  .art.lead ~ .bar i { background: var(--accent); }
  .cap { margin-top: 6px; font-size: 13px; font-weight: 700; line-height: 1.25;
         overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cap span { color: #b3b3b3; font-weight: 500; }

  .foot { margin-top: 16px; font-size: 14px; color: #b3b3b3; }

  .winner { display: flex; gap: 24px; align-items: center; }
  .winner img { width: 152px; border-radius: 4px; box-shadow: 0 14px 34px rgba(0,0,0,.7); }
  .winner .k { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
  .winner h2 { font-size: 44px; margin: 9px 0 8px; letter-spacing: -.035em; line-height: 1; font-weight: 900; }
  .winner .sub { color: #b3b3b3; font-size: 16px; }
  .idle { color: #b3b3b3; font-size: 16px; padding: 6px 0; }
</style>
</head>
<body>
<div class="panel" id="panel"></div>
<script>
  try {
    const q = new URLSearchParams(location.search).get('accent');
    const a = q || localStorage.getItem('mn_accent');
    if (a) { document.documentElement.dataset.accent = a; }
    if (q) { localStorage.setItem('mn_accent', q); }
  } catch (e) { /* OBS with site data disabled: keep the default accent */ }
</script>
<script type="module">
let state = null;
if (new URLSearchParams(location.search).has('solid')) document.body.style.background = '#141414';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const art = (m, size) => m.poster
  ? `<img src="${esc(state.posterBase)}/${size}${esc(m.poster)}" alt="">`
  : `<div class="noposter">${esc(m.title)}</div>`;

function tiles(items, value, leadValue, noun) {
  return items.map((m, i) => {
    const n = value(m);
    const label = m.position ? `!vote ${m.position}` : `${i + 1}`;
    return `
    <div class="item">
      <div class="art ${n === leadValue && leadValue > 0 ? 'lead' : ''}">
        <span class="num">${label}</span>
        ${art(m, 'w342')}
      </div>
      <div class="bar"><i style="width:${(n / Math.max(1, leadValue)) * 100}%"></i></div>
      <div class="count"><b>${n}</b> ${n === 1 ? noun[0] : noun[1]}</div>
      <div class="cap">${esc(m.title)} <span>${m.year ?? ''}</span></div>
    </div>`;
  }).join('');
}

function render() {
  const p = document.getElementById('panel');
  if (!state) return;

  if (state.phase === 'voting') {
    const left = state.poll.closesAt - Date.now();
    const max = Math.max(0, ...state.options.map((o) => o.votes));
    p.innerHTML = `
      <div class="head">
        <h1>Voting open<span class="cmd">Type <code>!vote 2</code> in chat</span></h1>
        <span class="timer ${left < 30000 ? 'urgent' : ''}" id="t">${clock(left)}</span>
      </div>
      <div class="row">${tiles(state.options, (o) => o.votes, max, ['vote', 'votes'])}</div>
      <div class="foot">${state.voters} ${state.voters === 1 ? 'person has' : 'people have'} voted ·
        one vote each, change it any time before the timer ends</div>`;
    return;
  }

  if (state.phase === 'results' && state.tie.length > 1) {
    const max = Math.max(1, ...state.tie.map((t) => t.votes));
    p.innerHTML = `
      <div class="head">
        <h1>It's a tie<span class="cmd">${state.tie[0].votes}
          ${state.tie[0].votes === 1 ? 'vote' : 'votes'} each — nothing decided yet</span></h1>
      </div>
      <div class="row">${state.tie.map((t, i) => `
        <div class="item">
          <div class="art lead">
            <span class="num">${i + 1}</span>
            ${t.poster
              ? `<img src="${esc(state.posterBase)}/w342${esc(t.poster)}" alt="">`
              : `<div class="noposter">${esc(t.title)}</div>`}
          </div>
          <div class="bar"><i style="width:${(t.votes / max) * 100}%"></i></div>
          <div class="count"><b>${t.votes}</b> ${t.votes === 1 ? 'vote' : 'votes'}</div>
          <div class="cap">${esc(t.title)} <span>${t.year ?? ''}</span></div>
        </div>`).join('')}</div>
      <div class="foot">A tiebreaker is coming — same movies, one more vote</div>`;
    return;
  }

  if (state.phase === 'results' && state.winner) {
    const w = state.winner;
    p.innerHTML = `
      <div class="winner">
        ${w.poster ? `<img src="${esc(state.posterBase)}/w342${esc(w.poster)}" alt="">` : ''}
        <div>
          <div class="k">Tonight's movie</div>
          <h2>${esc(w.title)}</h2>
          <div class="sub">${w.year ? w.year + ' · ' : ''}won with ${w.votes} of
            ${state.voters} ${state.voters === 1 ? 'vote' : 'votes'}</div>
        </div>
      </div>`;
    return;
  }

  const top = state.nominations.slice(0, state.rules.shortlistSize);
  const max = Math.max(0, ...top.map((n) => n.interest));
  p.innerHTML = `
    <div class="head">
      <h1>Nominations open<span class="cmd">Add yours at <code>${esc(state.siteUrl)}</code></span></h1>
    </div>
    ${top.length
      ? `<div class="row">${tiles(top, (n) => n.interest, max, ['person wants it', 'people want it'])}</div>
         <div class="foot">Not the vote yet — the ${state.rules.shortlistSize} most wanted
           become the choices, then voting opens live on stream</div>`
      : `<div class="idle">No nominations yet — add one at <code>${esc(state.siteUrl)}</code></div>`}`;
}

setInterval(() => {
  const t = document.getElementById('t');
  if (t && state?.poll) {
    const left = state.poll.closesAt - Date.now();
    t.textContent = clock(left);
    t.classList.toggle('urgent', left < 30000);
  }
}, 250);

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'state') { state = msg.data; render(); }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

state = await (await fetch('/api/state')).json();
render();
connect();
</script>
</body>
</html>
