<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night · Control</title>
<link rel="stylesheet" href="/app.css">
<script>
  // Accent is a one-variable swap: ?accent=red for the red build, ?accent=purple for Twitch.
  try {
    const q = new URLSearchParams(location.search).get('accent');
    const a = q || localStorage.getItem('mn_accent');
    if (a) { document.documentElement.dataset.accent = a; }
    if (q) { localStorage.setItem('mn_accent', q); }
  } catch (e) { /* private browsing: fall back to the default accent */ }
</script>

<style>
  /* Built for a phone in one hand while the stream runs. */
  .wrap { max-width: 640px; }
  .pad { padding: 0 16px; }
  .durations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .durations .btn { padding: 15px 4px; font-size: 15px; }
  .line { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .line img { width: 42px; height: 63px; object-fit: cover; border-radius: 3px; flex: none; background: var(--surface-2); }
  .line .t { flex: 1; min-width: 0; }
  .line .t b { display: block; font-size: 14.5px; }
  .line .t small { color: var(--muted); font-size: 12px; }
  .line .t a { color: var(--muted); font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--line); }
  .line .t a:hover { color: #fff; }
  .ph { width: 42px; height: 63px; border-radius: 3px; flex: none;
        background: linear-gradient(160deg,#262626,#161616); }
  .win { display: flex; gap: 16px; align-items: center; }
  .win img { width: 84px; border-radius: 4px; flex: none; }
  .win h2 { margin: 4px 0; font-size: 24px; font-weight: 900; letter-spacing: -.025em; }
  .urls code { word-break: break-all; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Control <small id="chan"></small></h1>
    <div id="auth"></div>
  </div>
</header>
<div class="wrap">
  <main id="main" class="pad"></main>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
let state = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

async function post(url, body) {
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? 'Failed.');
  return data;
}

function toast(m, err) {
  const t = $('#toast');
  if (t) { t.textContent = m; t.className = err ? 'toast err' : 'toast'; }
}

const thumb = (m) => m.poster
  ? `<img src="${esc(state.posterBase)}/w92${esc(m.poster)}" alt="" loading="lazy">`
  : `<div class="ph"></div>`;

function render() {
  $('#chan').textContent = state.channel ? `#${state.channel}` : '';
  $('#auth').innerHTML = state.me
    ? `<span class="who">${esc(state.me.login)}</span>`
    : `<a class="btn cta" href="/auth/login"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg> Sign in with Twitch</a>`;

  if (!state.me) { $('#main').innerHTML = '<div class="card empty">Sign in with the streamer account.</div>'; return; }
  if (!state.me.isBroadcaster) { $('#main').innerHTML = '<div class="card empty">Streamer only.</div>'; return; }

  const voting = state.phase === 'voting';
  const shortlist = state.nominations.slice(0, state.rules.shortlistSize);

  const board = state.nominations.length ? state.nominations.map((n, i) => `
    <div class="line">
      ${thumb(n)}
      <div class="t">
        <b>${i < state.rules.shortlistSize ? '★ ' : ''}${esc(n.title)}</b>
        <small>${n.year ? n.year + ' · ' : ''}${n.interest} interest · by ${esc(n.nominator)}</small>
        ${n.trailer ? `<a href="https://www.youtube.com/watch?v=${esc(n.trailer)}"
           target="_blank" rel="noopener noreferrer">▶ Trailer</a>` : ''}
      </div>
      <button class="btn danger" data-veto="${n.id}">Veto</button>
    </div>`).join('') : '<div class="empty">No nominations yet.</div>';

  $('#main').innerHTML = `
    <div class="card">
      ${voting ? `
        <div class="eyebrow"><span class="dot live"></span> Voting open ·
          <span class="timer" id="t">${clock(state.poll.closesAt - Date.now())}</span></div>
        <p class="lede">${state.voters} voted so far.</p>
        <button class="btn red big" id="close">End poll now</button>
      ` : `
        <div class="eyebrow"><span class="dot"></span>
          ${state.phase === 'results' ? 'Last poll finished' : 'Nominations open'}</div>
        <p class="lede">Opens a poll on the top ${state.rules.shortlistSize} by interest:
          <b>${shortlist.map((n) => esc(n.title)).join(', ') || 'nothing yet'}</b></p>
        <div class="durations">
          <button class="btn grey" data-open="120">2 min</button>
          <button class="btn cta" data-open="240">4 min</button>
          <button class="btn grey" data-open="360">6 min</button>
        </div>
      `}
      <div class="toast" id="toast"></div>
    </div>

    ${state.phase === 'results' && state.winner ? `
      <div class="card win">
        ${state.winner.poster ? `<img src="${esc(state.posterBase)}/w185${esc(state.winner.poster)}" alt="">` : ''}
        <div>
          <div class="eyebrow" style="margin-bottom:2px">Winner</div>
          <h2>${esc(state.winner.title)}</h2>
          <p class="muted">${state.winner.approvals} approvals · ${state.voters} voters</p>
        </div>
      </div>` : ''}

    <div class="card">
      <div class="eyebrow">The board — veto anything you can't or won't stream</div>
      ${board}
    </div>

    <div class="card urls">
      <div class="eyebrow">Links</div>
      <p class="muted">OBS browser source: <code>${location.origin}/overlay</code><br>
      Chat votes here: <code>${location.origin}/</code></p>
    </div>`;

  $$('[data-open]').forEach((b) => {
    b.onclick = async () => {
      try { await post('/api/poll/open', { durationSeconds: Number(b.dataset.open) }); toast('Poll open.'); }
      catch (e) { toast(e.message, true); }
    };
  });

  const c = $('#close');
  if (c) c.onclick = async () => {
    try { const r = await post('/api/poll/close'); toast(`Winner: ${r.winner?.title ?? 'none'}`); }
    catch (e) { toast(e.message, true); }
  };

  $$('[data-veto]').forEach((b) => {
    b.onclick = async () => {
      const reason = prompt('Veto reason (optional)');
      if (reason === null) return;
      try { await post(`/api/veto/${b.dataset.veto}`, { reason }); }
      catch (e) { toast(e.message, true); }
    };
  });
}

async function refresh() { state = await (await fetch('/api/state')).json(); render(); }

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'state') { state = { ...msg.data, channel: state?.channel, me: state?.me ?? null }; render(); }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

setInterval(() => {
  const t = $('#t');
  if (t && state?.poll) t.textContent = clock(state.poll.closesAt - Date.now());
}, 250);

await refresh();
connect();
</script>
</body>
</html>
