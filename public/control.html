<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night · Control</title>
<link rel="stylesheet" href="/app.css">
<style>
  /* Built for a phone in one hand while the stream runs. */
  .wrap { max-width: 560px; }
  .big { width: 100%; padding: 18px; font-size: 18px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .grid .btn { padding: 12px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🎛️ Control</h1>
    <div id="auth"></div>
  </header>
  <main id="main"></main>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
let state = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? 'Failed.');
  return data;
}

function toast(m, err) { const t = $('#toast'); if (t) { t.textContent = m; t.className = err ? 'toast err' : 'toast'; } }

function render() {
  $('#auth').innerHTML = state.me
    ? `<span class="who">${esc(state.me.login)}</span>`
    : `<a class="btn" href="/auth/login">Sign in with Twitch</a>`;

  if (!state.me) { $('#main').innerHTML = '<div class="card">Sign in with the streamer account.</div>'; return; }
  if (!state.me.isBroadcaster) { $('#main').innerHTML = '<div class="card">Streamer only.</div>'; return; }

  const voting = state.phase === 'voting';
  const board = state.nominations.map((n, i) => `
    <div class="row">
      <span class="title"><b>${i < state.rules.shortlistSize ? '⭐ ' : ''}${esc(n.title)}</b>
        <small>#${n.id} · ${n.interest} interest · by ${esc(n.nominator)}</small></span>
      <button class="btn danger" data-veto="${n.id}">Veto</button>
    </div>`).join('') || '<p class="muted">No nominations yet.</p>';

  $('#main').innerHTML = `
    <div class="card">
      ${voting ? `
        <span class="phase-tag">Voting open · <span class="timer" id="t">${clock(state.poll.closesAt - Date.now())}</span></span>
        <p class="muted">${state.voters} voted</p>
        <button class="btn danger big" id="close">End poll now</button>
      ` : `
        <span class="phase-tag">${state.phase === 'results' ? 'Last poll finished' : 'Nominations open'}</span>
        <p class="muted">Opens a poll on the top ${state.rules.shortlistSize} by interest.</p>
        <div class="grid">
          <button class="btn ghost" data-open="120">2 min</button>
          <button class="btn ghost" data-open="240">4 min</button>
          <button class="btn ghost" data-open="360">6 min</button>
        </div>
      `}
      <div class="toast" id="toast"></div>
    </div>
    <div class="card">
      <span class="phase-tag">Board — veto anything you can't or won't stream</span>
      ${board}
    </div>
    <p class="muted">Overlay for OBS: <code>${location.origin}/overlay</code></p>`;

  document.querySelectorAll('[data-open]').forEach((b) => {
    b.onclick = async () => {
      try { await post('/api/poll/open', { durationSeconds: Number(b.dataset.open) }); toast('Poll open.'); }
      catch (e) { toast(e.message, true); }
    };
  });

  const c = $('#close');
  if (c) c.onclick = async () => {
    try { const r = await post('/api/poll/close'); toast(`Winner: ${r.winner?.title ?? 'none'}`); }
    catch (e) { toast(e.message, true); }
  };

  document.querySelectorAll('[data-veto]').forEach((b) => {
    b.onclick = async () => {
      const reason = prompt('Veto reason (optional)') ?? '';
      try { await post(`/api/veto/${b.dataset.veto}`, { reason }); }
      catch (e) { toast(e.message, true); }
    };
  });
}

async function refresh() { state = await (await fetch('/api/state')).json(); render(); }

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'state') { state = { ...msg.data, me: state?.me ?? null }; render(); }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

setInterval(() => {
  const t = $('#t');
  if (t && state?.poll) t.textContent = clock(state.poll.closesAt - Date.now());
}, 250);

await refresh();
connect();
</script>
</body>
</html>
